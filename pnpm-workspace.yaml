packages:
  - apps/*
  - packages/*

# Dependencies allowed to run install scripts (pnpm blocks all others by default).
allowBuilds:
  '@prisma/engines': true # downloads the Prisma schema engine used by `prisma migrate`
  esbuild: true # verifies the platform-specific esbuild binary (tsx, tsup, vite)
  prisma: true
  unrs-resolver: false # prebuilt binary works without its postinstall (matches create-next-app)

# Single source of truth for versions that must stay aligned across workspace packages.
# Reference them from a package.json with `"<name>": "catalog:"`.
catalog:
  '@prisma/adapter-pg': 7.10.1
  '@prisma/client': 7.10.1
  '@types/node': ^24.19.2
  prisma: 7.10.1
  typescript: ~6.0.3
  vite: ^8.3.5
  vitest: ^5.0.5
  zod: ^4.6.7
