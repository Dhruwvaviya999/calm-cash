# Local development infrastructure for CalmCash.
# Values are read from the repository-root `.env` file (see `.env.example`).
#
#   pnpm db:up     # start PostgreSQL and wait until it is healthy
#   pnpm db:down   # stop it (data is kept in the named volume)
name: calmcash

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      # Bind to loopback only so the database is never exposed on the network.
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      # PostgreSQL 18+ images keep versioned data directories under /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
